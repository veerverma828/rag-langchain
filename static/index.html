<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local RAG Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app">
        <header class="app-header">
            <h1>Local RAG Chat</h1>
        </header>

        <main id="chat-window" class="chat-window"></main>

        <form id="chat-form" class="chat-form">
            <input type="text" id="question-input" class="chat-input" placeholder="Message..." autocomplete="off">
            <button type="submit" id="send-button" class="send-button" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
